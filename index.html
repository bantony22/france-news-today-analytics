<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>France News Today Analytics</title>
</head>

<body>
  <h1>France News Today Analytics</h1>

  <p>
    Private analytics dashboard for monitoring the performance
    of the France News Today TikTok account.
  </p>

  <h2>TikTok Analytics</h2>

  <p>
    Connect the authorized TikTok account to view profile statistics
    and public video performance.
  </p>

  <button id="tiktok-login" type="button">Connect with TikTok</button>

<script>
  document.getElementById("tiktok-login").addEventListener("click", function () {
    const clientKey = "sbaw8mmw2qzu4zzjp5";
    const redirectUri = "https://bantony22.github.io/france-news-today-analytics/callback.html";
    const scope = "user.info.basic,user.info.stats,video.list";
    const state = "france_news_today_analytics";

    const authUrl =
      "https://www.tiktok.com/v2/auth/authorize/" +
      "?client_key=" + encodeURIComponent(clientKey) +
      "&scope=" + encodeURIComponent(scope) +
      "&response_type=code" +
      "&redirect_uri=" + encodeURIComponent(redirectUri) +
      "&state=" + encodeURIComponent(state);

    window.location.href = authUrl;
  });
</script>

  <hr>

  <p>
    <a href="terms.html">Terms of Service</a>
    |
    <a href="privacy.html">Privacy Policy</a>
  </p>
</body>
</html>
